<head>

<style>
:root{color-scheme:light;--tab:#dee1e6;--tab-hover:#e8eaed;--tab-active:#fff;--toolbar:#f1f3f4;--omnibox:#e9eef6;--omnibox-focus:#fff;--surface:#fff;--surface2:#f8f9fa;--hover:#e8eaed;--border:#dadce0;--text:#202124;--muted:#5f6368;--blue:#1a73e8;--blue2:#8ab4f8;--menu:#fff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Google Sans","Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--text)}button,input{font:inherit;color:inherit}button{border:0}
#app{height:100%;display:grid;grid-template-rows:36px 50px 1fr;min-width:520px}
/* Chromium top-chrome / WebUI toolbar surface */
#tabstrip{height:36px;background:var(--tab);display:flex;align-items:flex-end;position:relative;padding-left:8px;user-select:none;-webkit-app-region:drag}
#tabs{height:36px;display:flex;align-items:flex-end;min-width:0;overflow:hidden;flex:1;-webkit-app-region:no-drag}
.tab{height:34px;min-width:120px;max-width:240px;flex:1 1 190px;position:relative;display:flex;align-items:center;gap:8px;padding:0 7px 0 12px;margin:0 1px 0 0;border-radius:10px 10px 0 0;background:var(--tab-hover);color:#5f6368;cursor:pointer;overflow:hidden;transition:background .12s}
.tab:before{content:"";position:absolute;left:-1px;top:7px;bottom:7px;width:1px;background:#5f6368;opacity:.5}.tab:first-child:before{display:none}.tab:hover{background:#fff}.tab.active{height:35px;background:var(--tab-active);color:#202124}.tab.pinned{min-width:48px;max-width:48px;flex:0 0 48px;padding:0 10px}.tab.pinned .title{display:none}.tab.pinned .favicon{margin:auto}.favicon{width:16px;height:16px;display:grid;place-items:center;flex:0 0 16px}.favicon img{width:16px;height:16px;border-radius:3px}.title{font-size:12px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.tabclose{width:24px;height:24px;border-radius:50%;background:transparent;display:grid;place-items:center;flex:0 0 24px;padding:0;cursor:pointer}.tabclose svg{width:16px;height:16px}.tabclose:hover{background:#dadce0}.tab.dragging{opacity:.55}.tab.drop-target{box-shadow:inset 3px 0 var(--blue)}
#tab-actions{height:36px;display:flex;align-items:center;gap:2px;padding:0 2px;-webkit-app-region:no-drag}.topround{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:transparent;cursor:pointer}.topround:hover{background:var(--hover)}.topround svg{width:18px;height:18px}
#window-controls{position:absolute;top:0;right:0;height:32px;z-index:99999;display:flex;align-items:center;-webkit-app-region:no-drag;app-region:no-drag}.wc{width:46px;height:36px;display:grid;place-items:center;background:transparent;cursor:pointer}.wc:hover{background:#f8f9fa}.wc.close:hover{background:#e81123}.wc svg{width:14px;height:14px;fill:currentColor}.wc.drag-control{-webkit-app-region:drag;cursor:grab}.wc.drag-control:hover{background:rgba(60,64,67,.08)}
/* Khan-IWA control geometry: exact 32px drag-square / 44px close-button treatment, adapted to Chromium's 36px top-chrome */
#window-controls.khan-controls .drag-square{width:32px;height:32px;margin-top:0}.drag-square svg{width:14px;height:14px;opacity:.75;color:#5f6368}.drag-square{-webkit-app-region:drag;app-region:drag;cursor:grab;display:flex;align-items:center;justify-content:center}.drag-square button{width:100%;height:100%;background:transparent;cursor:grab;-webkit-app-region:drag}.khan-close{width:44px;height:32px;margin-top:0;background:transparent;border:none;font-family:monospace,sans-serif;font-size:14px;color:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-app-region:no-drag;app-region:no-drag}.khan-close:hover{background:#e81123;color:#fff}.khan-close svg{width:14px;height:14px}
#toolbar{height:50px;background:var(--toolbar);display:flex;align-items:center;padding:0 8px;gap:2px;border-bottom:1px solid #dadce0;-webkit-app-region:drag}.webui-control,.tb,#omnibox,#right-tools{ -webkit-app-region:no-drag}.tb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:transparent;cursor:pointer;flex:0 0 36px}.tb:hover{background:var(--hover)}.tb:disabled{opacity:.32;cursor:default}.tb svg{width:20px;height:20px}
#omnibox{height:40px;flex:1;min-width:180px;display:flex;align-items:center;background:var(--omnibox);border-radius:20px;margin:0 5px;border:1px solid transparent;box-shadow:none;position:relative}.omnibox-focused{background:#fff!important;border-color:#a8c7fa!important;box-shadow:0 1px 3px #0005}.sec{width:34px;height:34px;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer;flex:0 0 34px}.sec:hover{background:#e8eaed}.omnibox-focused .sec:hover{background:#e8eaed}.sec svg{width:18px;height:18px}.addr{height:38px;min-width:0;flex:1;border:0;outline:0;background:transparent;color:#202124;padding:0 2px;font-size:14px}.omnibox-focused .addr{color:#202124}.omni-actions{display:flex;align-items:center}.omni-action{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:transparent;cursor:pointer}.omni-action:hover{background:#e8eaed}.omnibox-focused .omni-action:hover{background:#e8eaed}.omni-action svg{width:18px;height:18px}.saved svg{fill:#1a73e8}
#right-tools{display:flex;align-items:center;gap:1px}.profile{width:34px;height:34px;border-radius:50%;background:#1a73e8;color:#fff;display:grid;place-items:center;cursor:pointer}.profile svg{width:19px;height:19px}
#frames{position:relative;min-height:0;background:#fff}.frame{display:none;position:absolute;inset:0;width:100%;height:100%;border:0}.frame.active{display:block}
#suggestions{display:none;position:fixed;left:calc(40px + 130px);right:145px;top:78px;background:#fff;color:#202124;border:1px solid #dadce0;border-top:0;border-radius:0 0 20px 20px;padding:5px 0 8px;z-index:6000;box-shadow:0 8px 24px #0002}.sug{min-height:44px;display:flex;align-items:center;gap:12px;padding:7px 14px;cursor:pointer}.sug:hover,.sug.selected{background:#f1f3f4}.sug svg{width:18px;height:18px;fill:#5f6368;flex:0 0 18px}.sugmain{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.sugsub{font-size:12px;color:#5f6368;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
/* 2026 WebUI / Material refresh menu surfaces */
#menu,#ctx,#bubble{display:none;position:fixed;z-index:7000;background:var(--menu);border:1px solid #4c4d50;border-radius:18px;box-shadow:0 12px 34px #0003;padding:7px;color:var(--text)}.open{display:block!important}.mi{width:100%;min-height:40px;border-radius:10px;background:transparent;display:flex;align-items:center;gap:12px;padding:8px 11px;text-align:left;cursor:pointer;font-size:13px}.mi:hover{background:#e8eaed}.mi svg{width:19px;height:19px;flex:0 0 19px}.mi .shortcut{margin-left:auto;color:#5f6368;font-size:11px}.mi .chev{margin-left:auto;width:16px}.sep{height:1px;background:#dadce0;margin:6px 8px}.menu-section{padding:8px 11px 4px;font-size:11px;color:#5f6368}.glow-header{display:flex;align-items:center;gap:10px;padding:12px 12px 9px}.glow-avatar{width:34px;height:34px;border-radius:50%;overflow:hidden;background:#e8eaed}.glow-avatar img{width:100%;height:100%;object-fit:cover}.glow-title{font-size:14px;font-weight:500}.glow-sub{font-size:11px;color:#5f6368;margin-top:2px}
#menu{right:8px;top:84px;width:360px;max-height:calc(100vh - 92px);overflow:auto}.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px}.menu-card{min-height:70px;border-radius:12px;background:#f8f9fa;padding:10px;display:flex;flex-direction:column;justify-content:center;gap:6px;cursor:pointer}.menu-card:hover{background:#e8eaed}.menu-card svg{width:20px;height:20px}.menu-card span{font-size:11px}.menu-card b{font-size:12px;font-weight:500}.menu-card.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:50px}.menu-card.wide svg{flex:0 0 20px}
#ctx{min-width:270px;max-width:320px}.ctx-title{padding:8px 11px;font-size:11px;color:#5f6368;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#perms{position:fixed;right:14px;top:92px;z-index:6500;display:flex;flex-direction:column;gap:8px}.perm{width:360px;background:#fff;border:1px solid #4c4d50;border-radius:16px;box-shadow:0 10px 30px #0003;padding:14px}.permhead{display:flex;align-items:center;gap:10px;font-size:14px}.permhead svg{width:20px}.permsub{font-size:11px;color:#5f6368;margin-top:6px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.actions button,.ba button{border-radius:9px;padding:8px 13px;background:#1a73e8;color:#fff;cursor:pointer}.actions .deny,.ba .secondary{background:#e8eaed;color:#202124}
#bubble{min-width:310px;max-width:410px;padding:14px}.bt{font-size:14px;font-weight:500;margin-bottom:8px}.bx{font-size:12px;color:#5f6368;line-height:1.5}.ba{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
#modal{display:none;position:fixed;inset:0;background:#0006;z-index:8000;align-items:center;justify-content:center}.modal{width:min(800px,92vw);max-height:84vh;background:#fff;border:1px solid #4c4d50;border-radius:20px;overflow:hidden;box-shadow:0 18px 55px #0003}.mh{height:60px;display:flex;align-items:center;padding:0 18px 0 22px;border-bottom:1px solid #4a4b4e;font-size:18px}.mh button{margin-left:auto;width:36px;height:36px;border-radius:50%;background:transparent;font-size:23px;cursor:pointer}.mh button:hover{background:#e8eaed}.mb{padding:16px 20px 22px;max-height:calc(84vh - 60px);overflow:auto}.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;cursor:pointer}.row:hover{background:#e8eaed}.ri{width:34px;height:34px;border-radius:9px;background:#e8eaed;display:grid;place-items:center;flex:0 0 34px}.rm{min-width:0;flex:1}.rt{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rs{font-size:11px;color:#5f6368;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:30px;text-align:center;color:#5f6368}.modal-input{width:100%;height:42px;background:#f1f3f4;border:1px solid #5f6368;border-radius:10px;color:#202124;padding:0 12px;outline:none}.modal-input:focus{border-color:#8ab4f8}
@media(max-width:900px){#home{display:none}.profile{width:32px}.tab{min-width:95px}.sug{padding-left:10px;padding-right:10px}.sugsub{display:none}}
</style>
</head>

<div id="app">
