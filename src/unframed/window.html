<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/.well-known/manifest.webmanifest">
<script type="module" src="/unframed/unframed.js"></script>
<style>
:root{color-scheme:dark;--tab:#202124;--tab-hover:#292a2d;--tab-active:#303134;--toolbar:#202124;--omnibox:#303134;--omnibox-focus:#fff;--surface:#2b2c2f;--surface2:#303134;--hover:#3c4043;--border:#45464a;--text:#e8eaed;--muted:#9aa0a6;--blue:#8ab4f8;--blue2:#a8c7fa;--menu:#2b2c2f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Google Sans","Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--text)}button,input{font:inherit;color:inherit}button{border:0}
#app{height:100%;display:grid;grid-template-rows:36px 50px 1fr;min-width:520px}
/* Chromium top-chrome / WebUI toolbar surface */
#tabstrip{height:36px;background:var(--tab);display:flex;align-items:flex-end;position:relative;padding-left:8px;user-select:none;-webkit-app-region:drag}
#tabs{height:36px;display:flex;align-items:flex-end;min-width:0;overflow:hidden;flex:1;-webkit-app-region:no-drag}
.tab{height:34px;min-width:120px;max-width:240px;flex:1 1 190px;position:relative;display:flex;align-items:center;gap:8px;padding:0 7px 0 12px;margin:0 1px 0 0;border-radius:10px 10px 0 0;background:var(--tab-hover);color:#bdc1c6;cursor:pointer;overflow:hidden;transition:background .12s}
.tab:before{content:"";position:absolute;left:-1px;top:7px;bottom:7px;width:1px;background:#5f6368;opacity:.5}.tab:first-child:before{display:none}.tab:hover{background:#323337}.tab.active{height:35px;background:var(--tab-active);color:#fff}.tab.pinned{min-width:48px;max-width:48px;flex:0 0 48px;padding:0 10px}.tab.pinned .title{display:none}.tab.pinned .favicon{margin:auto}.favicon{width:16px;height:16px;display:grid;place-items:center;flex:0 0 16px}.favicon img{width:16px;height:16px;border-radius:3px}.title{font-size:12px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.tabclose{width:24px;height:24px;border-radius:50%;background:transparent;display:grid;place-items:center;flex:0 0 24px;padding:0;cursor:pointer}.tabclose svg{width:16px;height:16px}.tabclose:hover{background:#4a4b4f}.tab.dragging{opacity:.55}.tab.drop-target{box-shadow:inset 3px 0 var(--blue)}
#tab-actions{height:36px;display:flex;align-items:center;gap:2px;padding:0 2px;-webkit-app-region:no-drag}.topround{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:transparent;cursor:pointer}.topround:hover{background:var(--hover)}.topround svg{width:18px;height:18px}
#window-controls{height:36px;display:flex;align-items:stretch;-webkit-app-region:no-drag}.wc{width:46px;height:36px;display:grid;place-items:center;background:transparent;cursor:pointer}.wc:hover{background:#35363a}.wc.close:hover{background:#e81123}.wc svg{width:14px;height:14px;fill:currentColor}.wc.drag-control{-webkit-app-region:drag;cursor:grab}.wc.drag-control:hover{background:rgba(255,255,255,.08)}
/* Khan-IWA control geometry: exact 32px drag-square / 44px close-button treatment, adapted to Chromium's 36px top-chrome */
#window-controls.khan-controls .drag-square{width:32px;height:32px;margin-top:2px}.drag-square svg{width:14px;height:14px;opacity:.65}.drag-square{-webkit-app-region:drag;cursor:grab;display:flex;align-items:center;justify-content:center}.drag-square button{width:100%;height:100%;background:transparent;cursor:grab;-webkit-app-region:drag}.khan-close{width:44px;height:32px;margin-top:2px;background:transparent;border:none;font-family:monospace,sans-serif;font-size:14px;color:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-app-region:no-drag}.khan-close:hover{background:#e81123}.khan-close svg{width:14px;height:14px}
#toolbar{height:50px;background:var(--toolbar);display:flex;align-items:center;padding:0 8px;gap:2px;border-bottom:1px solid #17181a;-webkit-app-region:drag}.webui-control,.tb,#omnibox,#right-tools{ -webkit-app-region:no-drag}.tb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:transparent;cursor:pointer;flex:0 0 36px}.tb:hover{background:var(--hover)}.tb:disabled{opacity:.32;cursor:default}.tb svg{width:20px;height:20px}
#omnibox{height:40px;flex:1;min-width:180px;display:flex;align-items:center;background:var(--omnibox);border-radius:20px;margin:0 5px;border:1px solid transparent;box-shadow:none;position:relative}.omnibox-focused{background:#fff!important;border-color:#a8c7fa!important;box-shadow:0 1px 3px #0005}.sec{width:34px;height:34px;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer;flex:0 0 34px}.sec:hover{background:#3c4043}.omnibox-focused .sec:hover{background:#f1f3f4}.sec svg{width:18px;height:18px}.addr{height:38px;min-width:0;flex:1;border:0;outline:0;background:transparent;color:#e8eaed;padding:0 2px;font-size:14px}.omnibox-focused .addr{color:#202124}.omni-actions{display:flex;align-items:center}.omni-action{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:transparent;cursor:pointer}.omni-action:hover{background:#3c4043}.omnibox-focused .omni-action:hover{background:#f1f3f4}.omni-action svg{width:18px;height:18px}.saved svg{fill:#8ab4f8}
#right-tools{display:flex;align-items:center;gap:1px}.profile{width:34px;height:34px;border-radius:50%;background:#8ab4f8;color:#202124;display:grid;place-items:center;cursor:pointer}.profile svg{width:19px;height:19px}
#frames{position:relative;min-height:0;background:#fff}.frame{display:none;position:absolute;inset:0;width:100%;height:100%;border:0}.frame.active{display:block}
#suggestions{display:none;position:fixed;left:calc(40px + 130px);right:145px;top:78px;background:#fff;color:#202124;border:1px solid #dadce0;border-top:0;border-radius:0 0 20px 20px;padding:5px 0 8px;z-index:6000;box-shadow:0 8px 24px #0005}.sug{min-height:44px;display:flex;align-items:center;gap:12px;padding:7px 14px;cursor:pointer}.sug:hover,.sug.selected{background:#f1f3f4}.sug svg{width:18px;height:18px;fill:#5f6368;flex:0 0 18px}.sugmain{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.sugsub{font-size:12px;color:#5f6368;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
/* 2026 WebUI / Material refresh menu surfaces */
#menu,#ctx,#bubble{display:none;position:fixed;z-index:7000;background:var(--menu);border:1px solid #4c4d50;border-radius:18px;box-shadow:0 12px 34px #0008;padding:7px;color:var(--text)}.open{display:block!important}.mi{width:100%;min-height:40px;border-radius:10px;background:transparent;display:flex;align-items:center;gap:12px;padding:8px 11px;text-align:left;cursor:pointer;font-size:13px}.mi:hover{background:#3c4043}.mi svg{width:19px;height:19px;flex:0 0 19px}.mi .shortcut{margin-left:auto;color:#9aa0a6;font-size:11px}.mi .chev{margin-left:auto;width:16px}.sep{height:1px;background:#4b4c50;margin:6px 8px}.menu-section{padding:8px 11px 4px;font-size:11px;color:#9aa0a6}.glow-header{display:flex;align-items:center;gap:10px;padding:12px 12px 9px}.glow-avatar{width:34px;height:34px;border-radius:50%;overflow:hidden;background:#3c4043}.glow-avatar img{width:100%;height:100%;object-fit:cover}.glow-title{font-size:14px;font-weight:500}.glow-sub{font-size:11px;color:#9aa0a6;margin-top:2px}
#menu{right:8px;top:84px;width:360px;max-height:calc(100vh - 92px);overflow:auto}.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px}.menu-card{min-height:70px;border-radius:12px;background:#35363a;padding:10px;display:flex;flex-direction:column;justify-content:center;gap:6px;cursor:pointer}.menu-card:hover{background:#3c4043}.menu-card svg{width:20px;height:20px}.menu-card span{font-size:11px}.menu-card b{font-size:12px;font-weight:500}.menu-card.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:50px}.menu-card.wide svg{flex:0 0 20px}
#ctx{min-width:270px;max-width:320px}.ctx-title{padding:8px 11px;font-size:11px;color:#9aa0a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#perms{position:fixed;right:14px;top:92px;z-index:6500;display:flex;flex-direction:column;gap:8px}.perm{width:360px;background:#2b2c2f;border:1px solid #4c4d50;border-radius:16px;box-shadow:0 10px 30px #0008;padding:14px}.permhead{display:flex;align-items:center;gap:10px;font-size:14px}.permhead svg{width:20px}.permsub{font-size:11px;color:#9aa0a6;margin-top:6px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.actions button,.ba button{border-radius:9px;padding:8px 13px;background:#8ab4f8;color:#202124;cursor:pointer}.actions .deny,.ba .secondary{background:#3c4043;color:#e8eaed}
#bubble{min-width:310px;max-width:410px;padding:14px}.bt{font-size:14px;font-weight:500;margin-bottom:8px}.bx{font-size:12px;color:#bdc1c6;line-height:1.5}.ba{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
#modal{display:none;position:fixed;inset:0;background:#0009;z-index:8000;align-items:center;justify-content:center}.modal{width:min(800px,92vw);max-height:84vh;background:#2b2c2f;border:1px solid #4c4d50;border-radius:20px;overflow:hidden;box-shadow:0 18px 55px #000a}.mh{height:60px;display:flex;align-items:center;padding:0 18px 0 22px;border-bottom:1px solid #4a4b4e;font-size:18px}.mh button{margin-left:auto;width:36px;height:36px;border-radius:50%;background:transparent;font-size:23px;cursor:pointer}.mh button:hover{background:#3c4043}.mb{padding:16px 20px 22px;max-height:calc(84vh - 60px);overflow:auto}.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;cursor:pointer}.row:hover{background:#3c4043}.ri{width:34px;height:34px;border-radius:9px;background:#3c4043;display:grid;place-items:center;flex:0 0 34px}.rm{min-width:0;flex:1}.rt{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rs{font-size:11px;color:#9aa0a6;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:30px;text-align:center;color:#9aa0a6}.modal-input{width:100%;height:42px;background:#202124;border:1px solid #5f6368;border-radius:10px;color:#e8eaed;padding:0 12px;outline:none}.modal-input:focus{border-color:#8ab4f8}
@media(max-width:900px){#home{display:none}.profile{width:32px}.tab{min-width:95px}.sug{padding-left:10px;padding-right:10px}.sugsub{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="tabstrip">
    <div id="tabs"></div>
    <div id="tab-actions"><button id="tabsearch" class="topround" title="Search tabs" aria-label="Search tabs">{{TABSEARCH}}</button><button id="newtab" class="topround" title="New tab" aria-label="New tab">{{ADD}}</button></div>
    <div id="window-controls" class="khan-controls">
      <div class="drag-square drag-control" title="Maximize / restore window" aria-label="Maximize / restore window"><svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></div>
      <button id="close" class="khan-close" title="Close" aria-label="Close">&#x2715;</button>
    </div>
  </div>
  <div id="toolbar">
    <button id="back" class="tb webui-control" title="Back">{{BACK}}</button>
    <button id="forward" class="tb webui-control" title="Forward">{{FORWARD}}</button>
    <button id="reload" class="tb webui-control" title="Reload">{{REFRESH}}</button>
    <button id="home" class="tb webui-control" title="Home">{{HOME}}</button>
    <div id="omnibox" class="webui-control">
      <button id="security" class="sec" title="View site information">{{SECURITY}}</button>
      <input id="addr" class="addr" autocomplete="off" spellcheck="false" aria-label="Address and search bar">
      <div class="omni-actions"><button id="star" class="omni-action" title="Bookmark this tab">{{STAR}}</button></div>
    </div>
    <div id="right-tools">
      <button id="downloads" class="tb" title="Downloads">{{DOWNLOAD}}</button>
      <button id="extensions" class="tb" title="Extensions">{{EXTENSIONS}}</button>
      <button id="profile" class="profile" title="Profile">{{PERSON}}</button>
      <button id="menub" class="tb" title="Customize and control Chromium">{{MORE}}</button>
    </div>
  </div>
  <div id="frames"></div>
</div>
<div id="suggestions"></div><div id="ctx"></div><div id="menu"></div><div id="bubble"></div><div id="perms"></div>
<div id="modal"><div class="modal"><div class="mh"><span id="mt"></span><button id="mx" aria-label="Close">{{CLOSE}}</button></div><div id="mb" class="mb"></div></div></div>
<script>
const ICONS={TABSEARCH:'tabsearch',ADD:'add',BACK:'back',FORWARD:'forward',REFRESH:'refresh',HOME:'home',SECURITY:'security',STAR:'star',DOWNLOAD:'download',EXTENSIONS:'extensions',PERSON:'person',MORE:'more'};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
for(const [id,name] of Object.entries(ICONS)){document.body.innerHTML=document.body.innerHTML.replaceAll('{{'+id+'}}',`<svg aria-hidden="true"><use href="/assets/icons.svg#${name}"></use></svg>`)}
</script>
</body></html>
