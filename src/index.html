<!doctype html>
<html><head><meta charset="utf-8"><script type="module" src="/launcher.js"></script>
<link rel="manifest" href="/.well-known/manifest.webmanifest">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f8f9fa;font-family:Arial,system-ui,sans-serif;overflow:hidden}
.splash{height:100%;display:flex;align-items:center;justify-content:center;background:#f8f9fa;color:#202124;gap:18px}
.splash img{width:96px;height:96px;object-fit:contain}.splash h1{font-size:28px;font-weight:500}
#fallback-controls{display:none;position:absolute;bottom:25px;left:0;right:0;text-align:center;color:#5f6368}
button{padding:9px 16px;border:0;border-radius:8px;background:#1a73e8;color:#fff;font-weight:600}
</style></head>
<body>
<div class="splash"><img src="/splashscreen.png"><h1>Chromium</h1></div>
<div id="fallback-controls"><p>Window-management permission is required.</p><button id="permission-prompt">Grant permission</button></div>
</body></html>
